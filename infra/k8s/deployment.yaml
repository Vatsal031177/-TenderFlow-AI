apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenderflow-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tenderflow-backend
  template:
    metadata:
      labels:
        app: tenderflow-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/your-org/tenderflow-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: tenderflow-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tenderflow-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tenderflow-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
